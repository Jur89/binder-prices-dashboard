name: Update sealed prices

on:
  schedule:
    - cron: "17 5 * * *"      # every day at 05:17 UTC
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write              # needed to commit the updated price file

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sealed price file
        env:
          CM_PRICE_GUIDE_URL: ${{ vars.CM_PRICE_GUIDE_URL }}
          CM_PRODUCT_LIST_URL: ${{ vars.CM_PRODUCT_LIST_URL }}
        run: python build_sealed_prices.py

      - name: Commit the price file
        run: |
          git config user.name "binder-bot"
          git config user.email "binder-bot@users.noreply.github.com"
          git add data/sealed-prices.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update sealed prices"
            git push
          fi
